server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain application/manifest+json;
  gzip_min_length 1024;

  # Locations below only use `expires`, so they inherit these headers. The one
  # that adds its own (embed.js) repeats them.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # blob: for exported files, worker-src for the GIF encoder
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  # English at the root, short cache so a release shows up right away
  location / {
    try_files $uri $uri/ =404;
    expires 5m;
    error_page 404 /404.html;
  }

  # Portuguese at /pt/
  location /pt/ {
    try_files $uri $uri/ =404;
    expires 5m;
    error_page 404 /404.html;
  }

  location = /pt {
    return 301 /pt/;
  }

  # Vite's hashed files never change
  location /assets/ {
    expires max;
  }

  location /fonts/ {
    expires 30d;
  }

  # <blob-avatar> for other sites: readable from any origin
  location = /embed.js {
    expires 1h;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
